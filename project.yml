name: AmbientPoetry
options:
  bundleIdPrefix: com.ra7an
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: Ambient Poetry
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 RA7AN. MIT License."
    INFOPLIST_KEY_CFBundleDisplayName: Ambient Poetry
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AmbientPoetry:
    type: application
    platform: macOS
    sources:
      - path: AmbientPoetry/App
      - path: AmbientPoetry/Desktop
      - path: AmbientPoetry/Experience
      - path: AmbientPoetry/Engine
      - path: AmbientPoetry/Views
      - path: AmbientPoetry/Assets.xcassets
        buildPhase: resources
      - path: Resources/Poems/if-kipling.json
        buildPhase: resources
      - path: Resources/Backgrounds/city-night.png
        buildPhase: resources
      - path: Resources/Backgrounds/ATTRIBUTION.md
        buildPhase: resources
      - path: AmbientPoetry/AmbientPoetry.entitlements
        buildPhase: none
      - path: AmbientPoetry/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ra7an.AmbientPoetry
        PRODUCT_NAME: Ambient Poetry
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: AmbientPoetry/AmbientPoetry.entitlements
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: LaunchAtLogin
        product: LaunchAtLogin
    info:
      path: AmbientPoetry/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ambient Poetry
        CFBundleName: Ambient Poetry
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        NSHighResolutionCapable: true
